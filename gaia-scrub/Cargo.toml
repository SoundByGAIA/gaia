[package]
name = "gaia-scrub"
version = "0.2.1"
edition = "2021"
description = "GAIA Scrub — air-gapped PII & secret redactor for logs, dumps and support files."
license = "Apache-2.0"

[[bin]]
name = "gaia-scrub"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

