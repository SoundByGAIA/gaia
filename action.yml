name: GAIA secret scan
description: Air-gapped secret scanner. Fails the job when secrets are found.
inputs:
  path:
    description: Directory to scan
    default: "."
runs:
  using: composite
  steps:
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq gnat
      shell: bash
    - run: cargo build --release --manifest-path "${{ github.action_path }}/Cargo.toml"
      shell: bash
    - run: ${{ github.action_path }}/target/release/gaia "${{ inputs.path }}" --fail-on-findings
      shell: bash
