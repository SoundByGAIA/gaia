name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gnat strace
      - run: cargo build --release
      - name: scanner finds a planted secret
        run: |
          mkdir t && echo 'k="AKIAABCDEFGHIJKLMNOP"' > t/a.env
          ! ./target/release/gaia t --fail-on-findings
      - name: drift and scrub work
        run: |
          echo 'stripe.charges.create(x)' > t/d.js
          ./target/release/gaia-drift t | grep -q Stripe
          echo 'a@b.com' | ./target/release/gaia-scrub - 2>/dev/null | grep -q EMAIL
      - name: no network syscalls
        run: |
          out=$(strace -f -e trace=network ./target/release/gaia t 2>&1 >/dev/null | grep -v '^+++' || true)
          test -z "$out"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir clean && echo 'hello = 1' > clean/a.txt && mkdir dirty && echo 'k="AKIAABCDEFGHIJKLMNOP"' > dirty/a.env
      - name: clean dir passes
        uses: ./
        with:
          path: clean
      - name: dirty dir fails
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          path: dirty
      - run: test "${{ steps.dirty.outcome }}" = failure
